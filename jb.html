<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MESTO GAME & Mansoor0x</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        color: #c8ced8;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background-color: #090c10;
        /* خلفية رايقة وداكنة مع اللوجو بشكل ضبابي وناعم في الخلفية */
        background-image: 
          radial-gradient(circle at center, rgba(14, 23, 38, 0.75) 0%, rgba(9, 12, 16, 0.95) 100%),
          url('logo.png');
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        display: flex;
        flex-direction: column;
      }

      /* شريط العنوان العالي */
      #brand {
        text-align: center;
        padding: 12px 16px;
        background: rgba(14, 17, 22, 0.85);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 10;
      }
      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 10px;
        border-radius: 50%;
        vertical-align: middle;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      /* الحاوية الرئيسية في المنتصف */
      #main-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      /* المربع المودرن الزجاجي */
      .status-card {
        background: rgba(18, 24, 36, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(127, 208, 160, 0.25);
        border-radius: 16px;
        padding: 40px 30px;
        text-align: center;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5),
                    inset 0 0 15px rgba(127, 208, 160, 0.05);
        min-width: 320px;
        max-width: 90%;
        transition: all 0.3s ease;
      }

      /* المربع المحيط بنص jailbreakON */
      #spin {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 10px;
        background: rgba(127, 208, 160, 0.1);
        border: 1px solid rgba(127, 208, 160, 0.4);
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 2.5px;
        color: #7fd0a0;
        text-shadow: 0 0 12px rgba(127, 208, 160, 0.5);
        animation: pulseGlow 1.8s ease-in-out infinite alternate;
      }
      #spin::before {
        content: "jailbreakON";
      }

      @keyframes pulseGlow {
        0% {
          transform: scale(0.98);
          box-shadow: 0 0 10px rgba(127, 208, 160, 0.2);
          border-color: rgba(127, 208, 160, 0.3);
        }
        100% {
          transform: scale(1.03);
          box-shadow: 0 0 25px rgba(127, 208, 160, 0.5);
          border-color: rgba(127, 208, 160, 0.8);
          text-shadow: 0 0 18px rgba(127, 208, 160, 0.9);
        }
      }

      #msg {
        font-size: 16px;
        color: #d08a7f;
        margin-top: 15px;
        letter-spacing: 0.5px;
        display: none;
      }

      #wrap {
        width: 100%;
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin,
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- السجل الكامل للخطوات */
      body.log #main-container {
        align-items: flex-start;
      }
      body.log .status-card {
        width: 100%;
        max-width: 900px;
        text-align: left;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 0;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 12px;
        color: #7fd0a0;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font-family: Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
        background: rgba(10, 13, 18, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 12px 16px;
        height: 60vh;
        overflow-y: auto;
        color: #b0b9c6;
      }
      .ok, .safe { color: #7fd0a0; }
      .bad, .danger { color: #d08a7f; }
      .warn { color: #d8c07f; }
      code { color: #9fb3d0; }
    </style>
  </head>
  <body>
    <div id="brand">
      <img
        src="logo_raw.png"
        alt=""
        width="28"
        height="28"
      /><b>MESTO GAME & Mansoor0x</b>
    </div>

    <div id="main-container">
      <div class="status-card">
        <div id="spin"></div>
        <div id="msg">يرجى اعادة تدوير الجهاز (لم ينجح التعديل حاول مرة اخرى)</div>
        <div id="wrap">
          <div id="state"></div>
          <div id="out"></div>
        </div>
      </div>
    </div>

    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
