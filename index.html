<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MESTO GAME & Mansoor0x</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    width: 100vw;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background-color: #0b0e14;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* صورة الخلفية في المنتصف */
  body::before {
    content: "";
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(550px, 85vw);
    height: min(550px, 85vw);
    background: url("logo.png") center center / contain no-repeat;
    opacity: 0.35;
    z-index: 1;
    pointer-events: none;
    filter: drop-shadow(0 0 20px rgba(0, 162, 255, 0.3));
  }

  /* شريط العنوان العلوي */
  #brand {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px 20px;
    background: rgba(14, 17, 22, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(0, 162, 255, 0.2);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  #brand img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid #00a2ff;
  }

  #brand b {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(0, 162, 255, 0.5);
    direction: ltr;
  }

  /* الحاوية الرئيسية للتمركز المنتصف */
  #main-container {
    position: relative;
    z-index: 10;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* بطاقة النص الشفافة لترتيب ووضوح الخط */
  #wrap {
    width: 100%;
    max-width: 500px;
    background: rgba(15, 20, 28, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
  }

  #state {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  #det {
    font-size: 15px;
    color: #a0aec0;
    margin: 0 0 12px;
    line-height: 1.6;
    direction: ltr;
  }

  #det b {
    color: #ffffff;
    font-weight: 600;
  }

  #cache {
    font-size: 13px;
    color: #718096;
    margin: 0;
    min-height: 18px;
    font-weight: 500;
  }

  /* ألوان الحالات */
  .ok, #cache.cacheok { color: #48bb78; text-shadow: 0 0 8px rgba(72, 187, 120, 0.4); }
  .bad { color: #f56565; text-shadow: 0 0 8px rgba(245, 101, 101, 0.4); }
  .warn { color: #ecc94b; text-shadow: 0 0 8px rgba(236, 201, 75, 0.4); }
</style>
</head>
<body>

<div id="brand">
  <img src="logo.png" alt="Logo">
  <b>MESTO GAME & Mansoor0x</b>
</div>

<div id="main-container">
  <div id="wrap">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
